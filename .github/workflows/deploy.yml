name: CI/CD Backend FLCS

on:
  push:
    branches: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Deploiement sur Contabo via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true

          script: |
            echo "=== DEPLOY START ==="
            cd /var/www/backend/GESTION_FLCS

            echo "=== GIT PULL ==="
            git pull origin deploy

            echo "=== BUILD ==="
            mvn clean package -DskipTests

            echo "=== JAR FILES ==="
            ls -lh target/

            echo "=== PM2 RESTART ==="
            pm2 delete flcs-backend || true
            pm2 start java --name flcs-backend -- -jar target/*.jar
            pm2 save

            echo "=== PM2 STATUS ==="
            pm2 list

            echo "=== DEPLOY DONE ==="
